[package]
name = "hierarchical_agent_managed_knowledge_graph"
version = "0.1.10"
description = "Local Markdown hierarchy graph editor"
authors = ["Boris de Wit"]
edition = "2021"

[lib]
name = "hierarchical_agent_managed_knowledge_graph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-single-instance = { version = "=2.4.5", features = ["deep-link"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
libc = "0.2"
trash = "5"
