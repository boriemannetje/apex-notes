name: Publish Main Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-production-release
  cancel-in-progress: false

jobs:
  publish:
    name: publish main production app
    if: github.repository == 'boriemannetje/apex-notes'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Read app version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install chromium

      - name: Run production validation
        run: npm test && npm run test:e2e && cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Terminal-installable macOS package
        env:
          APEX_NOTES_ALLOW_ADHOC: "1"
        run: npm run package:mac

      - name: Prepare rolling production assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          cp "src-tauri/target/release/bundle/dmg/Apex Notes_${VERSION}_aarch64.dmg" \
            "release-assets/apex-notes-main-macos-arm64.dmg"
          cp "skills/apex-notes-writing/SKILL.md" "release-assets/apex-notes-SKILL.md"
          (
            cd skills
            zip -r "../release-assets/apex-notes-writing-skill.zip" apex-notes-writing
          )
          printf '%s\n' "$GITHUB_SHA" > release-assets/main-production-commit.txt
          printf '%s\n' "$VERSION" > release-assets/main-production-version.txt

      - name: Move rolling production tag
        run: |
          git tag -f main-production "$GITHUB_SHA"
          git push origin refs/tags/main-production --force

      - name: Publish or update rolling production release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view main-production >/dev/null 2>&1; then
            gh release upload main-production release-assets/* --clobber
            gh release edit main-production \
              --target "$GITHUB_SHA" \
              --title "Apex Notes main production" \
              --notes "Production build from main at ${GITHUB_SHA}. App version: ${VERSION}." \
              --latest
          else
            gh release create main-production release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Apex Notes main production" \
              --notes "Production build from main at ${GITHUB_SHA}. App version: ${VERSION}." \
              --latest
          fi
